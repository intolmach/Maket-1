<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="static/styles/reset.css" rel="stylesheet">
    <link href="static/styles/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>


    <title>Swiper</title>
</head>

<body>
    <section class="swiper-block">
        <header class="swiper-header">
            <h2 class="swiper-header__title">Ремонт техники различных брендов</h2>
        </header>
        <aside class="swiper swiper-menu">
            <ul class="swiper-wrapper swiper-list">
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Lenovo.svg" alt="Lenovo"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Samsung.svg" alt="Samsung"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Apple.svg" alt="Apple"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/View.svg" alt="ViewSonic"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Bosch.svg" alt="Bosch"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/HP.svg" alt="HP"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Acer.svg" alt="Acer"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Sony.svg" alt="Sony"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Lenovo.svg" alt="Lenovo"></a>
                </li> 
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/Samsung.svg" alt="Samsung"></a>
                </li>
                <li class="swiper-slide swiper-list__item">
                    <a class="swiper-list__link" href="#"><img src="static/images/View.svg" alt="ViewSonic"></a>
                </li>
            </ul>
            <div class="swiper-pagination"></div>
            <button class="swiper-menu__toggle-button"></button>
        </aside>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="static/js/swiper.js"></script>
</body>

</html>
